<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Diary</title>
<style>
:root{--bg:#f7f9fc;--paper:#ffffff;--ink:#344052;--muted:#8b96a8;--line:#e7eaf0;--soft:#f8f9fc;--mark:#eaf5ff;--accent:#77aee8;--pink:#f8dce7;--pink-strong:#e995b5;--yellow:#fff1b9;--yellow-strong:#e9c95f;--sky:#dceeff;--sky-strong:#77aee8}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#fff7fa 0%,#fffdf2 46%,#f3f9ff 100%);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}
.app{height:100vh;padding:18px 22px;display:flex;flex-direction:column;overflow:hidden}
.top{height:48px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.brand{font-size:19px;font-weight:900;letter-spacing:.04em;color:#55779b}.brand:after{content:"";display:inline-block;width:34px;height:8px;border-radius:8px;margin-left:10px;background:linear-gradient(90deg,var(--pink) 0 33%,var(--yellow) 33% 66%,var(--sky) 66%)}.today{font-size:12px;color:var(--muted)}
.spread{flex:1;min-height:0;display:grid;grid-template-columns:58% 42%;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 38px rgba(83,105,135,.09);overflow:hidden}
.left,.right{min-width:0;min-height:0;padding:20px 22px}.left{border-right:1px solid var(--line)}
.section-head{height:42px;display:flex;align-items:center;justify-content:space-between}
.title{font-family:inherit;font-size:21px;font-weight:800;letter-spacing:-.02em}.nav{display:flex;align-items:center;gap:8px}
.nav button,.mini{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:19px;padding:4px 8px}.nav strong{font-size:13px;min-width:115px;text-align:center}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays{height:28px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff8fb,#fffdf2,#f5faff);border-radius:8px 8px 0 0}.weekdays div{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.days{height:calc(100% - 70px);grid-template-rows:repeat(6,1fr)}
.day{min-height:0;padding:6px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.day:nth-child(7n){border-right:0}.day.other{background:#fbfaf7;color:#c6c2ba}.day.selected{background:var(--sky)}.day.today .num{background:var(--pink);color:#a14f71;font-weight:900}
.num{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;font-size:11px}
.ev{font-size:10px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:3px}.ev:before{content:"• ";color:var(--pink-strong)}
.right{display:flex;flex-direction:column}.week-head{height:42px;display:flex;justify-content:space-between;align-items:center}
.week-range{font-size:12px;color:var(--muted)}.weeknav button{border:0;background:transparent;font-size:17px;color:var(--muted);cursor:pointer}
.weekbody{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,1fr) 1.12fr}
.wday{min-height:0;border-top:1px solid var(--line);display:grid;grid-template-columns:74px 1fr;padding:6px 0;overflow:hidden}
.wlabel{font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.03em;padding:5px 8px 0 0;color:#555}.wlabel span{display:block;font-family:inherit;font-size:19px;margin-top:2px}
.wlabel.active{font-weight:900;color:#5d91c8}.wlabel.active span{background:var(--sky);border-radius:8px;padding:1px 7px;display:inline-block}.tasks{overflow:auto;padding-right:3px}.task{display:flex;align-items:center;gap:7px;font-size:11px;min-height:25px}
.task input{accent-color:var(--pink-strong)}.task.done .txt{text-decoration:line-through;color:#aaa}.txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x{border:0;background:none;color:#bbb;cursor:pointer}
.add{display:flex;gap:5px;margin-top:2px}.add input{flex:1;min-width:0;border:0;border-bottom:1px dashed #cfcac0;background:transparent;padding:5px 2px;font-size:11px;outline:none}.add button{border:0;background:transparent;color:#888;cursor:pointer}
.notes{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:8px;min-height:0}.note h3{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.08em;margin:0 0 5px}.note textarea{width:100%;height:calc(100% - 20px);resize:none;border:0;background:repeating-linear-gradient(transparent,transparent 23px,#edf0f5 24px);outline:none;font:11px/24px "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;padding:0 3px;color:var(--ink)}
.modal{position:fixed;inset:0;background:#0003;display:none;align-items:center;justify-content:center}.modal.on{display:flex}.box{width:370px;background:var(--paper);padding:20px;border-radius:12px;box-shadow:0 20px 60px #0002}.box h2{font-size:16px;margin:0 0 15px}.box input{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;outline:none}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.actions button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:7px;cursor:pointer}.actions .save{background:var(--sky-strong);color:#fff;border-color:var(--sky-strong)}
@media(max-width:900px){.app{height:auto;overflow:auto}.spread{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line);height:650px}.right{height:720px}}
</style>

<style>
.left .section-head{border-bottom:4px solid var(--pink);padding-bottom:5px}
.right .week-head{border-bottom:4px solid var(--sky);padding-bottom:5px}
.day:hover{background:#fff9e5}
.wday:nth-child(1) .wlabel,.wday:nth-child(4) .wlabel{color:#d57b9f}
.wday:nth-child(2) .wlabel,.wday:nth-child(5) .wlabel{color:#c49f32}
.wday:nth-child(3) .wlabel{color:#669fd8}
.notes .note:first-child{background:#fffaf0;border-radius:10px;padding:8px}
.notes .note:last-child{background:#fff6fa;border-radius:10px;padding:8px}
.add input::placeholder,.note textarea::placeholder{color:#b7bec9}
</style>

<style>
:root{
 --bg:#f8e9ee; --paper:#ffffff; --ink:#343944; --muted:#8b9099;
 --line:#e7e4e6; --soft:#faf8f9; --mark:#fbe8ef; --accent:#dc8fab;
 --pink:#f5d9e3; --pink-strong:#d9789b; --yellow:#fff4cf;
 --sky:#eaf5fb; --sky-strong:#83b8d6;
}
body{background:#f8e9ee !important}
.brand{color:#424955 !important}
.brand:after{display:none !important}
.spread{box-shadow:0 8px 28px rgba(92,63,75,.08)}
.left .section-head,.right .week-head{border-bottom:1px solid var(--line) !important;padding-bottom:0 !important}
.weekdays{background:#faf7f8 !important}
.day:hover{background:#fff8fa !important}
.day.selected{background:#fbe8ef !important}
.day.today .num{background:#f2cad8 !important;color:#9d4968 !important}
.num{font-size:15px !important;font-weight:700 !important;width:28px !important;height:28px !important}
.weekdays div{font-size:11px !important;font-weight:700}
.ev{font-size:10.5px !important}
.holiday-name{font-size:9px;color:#d75c6f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 2px 3px}
.day.holiday .num,.day.sunday .num{color:#d95367}
.day.saturday .num{color:#5d91bd}
.wlabel{color:#555 !important}
.wlabel.active{color:#bd607f !important}
.wlabel.active span{background:#fbe8ef !important}
.notes .note:first-child,.notes .note:last-child{background:#fff !important;border-radius:0 !important;padding:0 !important}
.task input{accent-color:#d9789b !important}
</style>

<style>
.day.sunday{background:#fff3f5}
.day.saturday{background:#f3f8fc}
.day.holiday{background:#ffedef}
.day.other.sunday,.day.other.holiday{background:#fcf5f6}
.day.other.saturday{background:#f7f9fb}
.day.selected{box-shadow:inset 0 0 0 2px #e6a3b8;background:#fbe8ef !important}
</style>

<style>
/* v6 readability */
.num{
  font-size:17px !important;
  font-weight:800 !important;
  width:31px !important;
  height:31px !important;
}
.ev{
  font-size:12px !important;
  line-height:1.45 !important;
  margin:3px 0 !important;
}
.holiday-name{
  font-size:10.5px !important;
  font-weight:650;
  margin:2px 0 3px 3px !important;
}
.weekdays div{font-size:12px !important}
.wday{
  grid-template-columns:68px 1fr !important;
  padding:7px 0 !important;
}
.wlabel{
  font-size:13px !important;
  padding-top:7px !important;
}
.wlabel span{
  font-size:21px !important;
}
.tasks{
  display:grid !important;
  grid-template-columns:1fr 1fr;
  gap:0;
  overflow:hidden !important;
  padding:0 !important;
}
.taskcol{
  min-width:0;
  padding:2px 10px 2px 8px;
  overflow:auto;
}
.taskcol + .taskcol{
  border-left:1px dashed #e1dadd;
}
.task{
  font-size:13px !important;
  min-height:28px !important;
  gap:7px !important;
}
.task input[type="checkbox"]{
  width:15px;
  height:15px;
  flex:0 0 auto;
}
.add{margin-top:3px !important}
.add input{
  font-size:12px !important;
  padding:6px 2px !important;
}
.note h3{font-size:12px !important}
.note textarea{
  font-size:12.5px !important;
  line-height:24px !important;
}
</style>

<style>
/* v7 - larger planner writing */
.ev{
  font-size:14px !important;
  line-height:1.5 !important;
  margin:4px 0 !important;
  font-weight:550;
}
.holiday-name{
  font-size:11px !important;
}
.wday{
  padding:8px 0 !important;
}
.wlabel{
  font-size:14px !important;
}
.wlabel span{
  font-size:23px !important;
}
.tasks{
  overflow:visible !important;
  align-items:stretch;
}
.taskcol{
  overflow:hidden !important;
  padding:1px 11px 1px 9px !important;
}
.task{
  font-size:14.5px !important;
  min-height:31px !important;
  line-height:1.3 !important;
}
.task input[type="checkbox"]{
  width:17px !important;
  height:17px !important;
}
.add{
  height:31px;
  margin-top:1px !important;
}
.add input{
  font-size:13.5px !important;
  padding:6px 2px !important;
}
.add button{
  font-size:15px;
}
.txt{
  line-height:1.35;
}
/* TODO 항목은 addTask의 평일 7개 / 주말 2개 제한에 따라 표시 */
</style>

<style>
.sync-status{font-size:11px;color:#8b9099;margin-left:auto;margin-right:14px}
.sync-status.saving{color:#b68b31}
.sync-status.ok{color:#6c9b78}
.sync-status.error{color:#c85d6c}
</style>


<style>
/* v9 - color markers */
.ev{display:block;width:max-content;max-width:100%;padding:1px 5px 1px 3px;border-radius:5px;cursor:pointer}
.task .txt{padding:2px 5px;border-radius:5px;cursor:pointer}
.mark-pink{background:#fbe3eb}
.mark-yellow{background:#fff2bd}
.mark-blue{background:#dfeffc}
.mark-green{background:#e2f2e4}
.mark-purple{background:#eee5f7}

.color-picker{display:flex;align-items:center;gap:7px;margin-top:12px}
.color-picker .color-label{font-size:12px;color:var(--muted);margin-right:2px}
.color-dot{width:19px;height:19px;border-radius:50%;border:1px solid #ddd;cursor:pointer;padding:0;position:relative}
.color-dot[data-color=""]{background:#fff}
.color-dot[data-color="pink"]{background:#f5cbd9}
.color-dot[data-color="yellow"]{background:#f7df83}
.color-dot[data-color="blue"]{background:#bcdcf2}
.color-dot[data-color="green"]{background:#c5e5c9}
.color-dot[data-color="purple"]{background:#d8c4e9}
.color-dot.selected{box-shadow:0 0 0 2px #fff,0 0 0 4px #9c7c88}

.add{align-items:center}
.task-color{position:relative;flex:0 0 auto}
.task-color-btn{width:17px;height:17px;border-radius:50%;border:1px solid #d8d2d4;background:#fff;cursor:pointer;padding:0}
.task-color-btn.pink{background:#f5cbd9}
.task-color-btn.yellow{background:#f7df83}
.task-color-btn.blue{background:#bcdcf2}
.task-color-btn.green{background:#c5e5c9}
.task-color-btn.purple{background:#d8c4e9}
.task-palette{display:none;position:absolute;z-index:20;bottom:24px;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;box-shadow:0 7px 20px #0002;gap:6px}
.task-palette.on{display:flex}
.task-palette .color-dot{width:17px;height:17px}
.edit-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.edit-actions .right{display:flex;gap:8px}
.danger{background:#fff;border:1px solid #e2aebd;color:#b9506c}
</style>


<style>
/* v10.4 - Monthly 일정 여러 줄 표시 (실제 #cal 컨테이너 적용) */
#cal .ev{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  white-space:normal !important;
  overflow:visible !important;
  text-overflow:clip !important;
  overflow-wrap:break-word !important;
  word-break:keep-all !important;
  line-height:1.35 !important;
  box-sizing:border-box !important;
  height:auto !important;
}
</style>


<style>
/* v10.5 - 좁은 창에서도 다이어리 폭 유지 + 브라우저 가로 스크롤 */
html, body{
  min-width:1200px !important;
}
.wrap{
  min-width:1160px !important;
}
</style>


<style>
/* v10.6 - Monthly / Weekly 정확히 1:1 */
.main{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
}
</style>





<style>
/* v10.8 - 최대화에서는 화면 꽉 채움 / 좁아지면 크기 유지 후 가로 스크롤 */
html, body{
  width:100% !important;
  min-width:1500px !important;
  overflow-x:auto !important;
}
.app{
  width:calc(100vw - 36px) !important;
  min-width:1464px !important;
  max-width:none !important;
  height:100vh !important;
  overflow:visible !important;
}
.top{
  width:100% !important;
  min-width:1464px !important;
  flex:0 0 auto !important;
}
.spread{
  width:100% !important;
  min-width:1464px !important;
  max-width:none !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  flex:1 0 auto !important;
}
.left,.right{
  width:auto !important;
  min-width:0 !important;
  max-width:none !important;
}
/* 기존 좁은 화면 반응형 규칙 무력화 */
@media(max-width:900px){
  html, body{
    min-width:1500px !important;
  }
  .app{
    width:1464px !important;
    min-width:1464px !important;
    height:100vh !important;
    overflow:visible !important;
  }
  .top{
    width:1464px !important;
    min-width:1464px !important;
  }
  .spread{
    width:1464px !important;
    min-width:1464px !important;
    grid-template-columns:732px 732px !important;
  }
  .left,.right{
    width:732px !important;
    min-width:732px !important;
    max-width:732px !important;
    height:auto !important;
  }
  .left{
    border-right:1px solid var(--line) !important;
    border-bottom:0 !important;
  }
}
</style>


<style>
/* v11 - 디자인 설정 + 메모장 */
.top-tools{display:flex;gap:7px;align-items:center;margin-left:8px}
.tool-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}

.settings-box{width:min(460px,92vw)}
.setting-group{margin:15px 0}
.setting-group>label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--muted)}
.setting-group select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.theme-grid button{padding:10px 6px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.theme-grid button.active{outline:2px solid var(--accent);font-weight:700}
.settings-actions{justify-content:space-between!important}

.notepad-box{width:min(900px,92vw);max-width:900px}
.notepad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.notepad-head h2{margin:0}
.notepad-layout{display:grid;grid-template-columns:230px 1fr;gap:14px;min-height:430px}
.scratch-list{border:1px solid var(--line);border-radius:10px;padding:6px;overflow:auto;max-height:480px;background:#fafafa}
.scratch-item{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 8px;cursor:pointer}
.scratch-item:last-child{border-bottom:0}
.scratch-item.active{background:var(--soft);border-radius:7px}
.scratch-item strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scratch-item span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.scratch-editor{display:flex;flex-direction:column;gap:8px}
#scratchTitle{font-size:15px;font-weight:700;padding:10px;border:1px solid var(--line);border-radius:8px}
#scratchBody{min-height:330px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;line-height:1.55}
.scratch-meta{font-size:10px;color:var(--muted)}
.scratch-actions{display:flex;gap:8px;justify-content:flex-end}

/* Theme variables */
body[data-theme="pink"]{--paper:#fffdfd;--soft:#f9e9ee;--accent:#c88398;--line:#eadde1;--muted:#8c7d82}
body[data-theme="cream"]{--paper:#fffef9;--soft:#f7efd9;--accent:#b99a61;--line:#e9dfc8;--muted:#8b806b}
body[data-theme="sage"]{--paper:#fcfefc;--soft:#e8f0e7;--accent:#7f9d80;--line:#d9e4d8;--muted:#748174}
body[data-theme="sky"]{--paper:#fcfdff;--soft:#e7f1f8;--accent:#7fa6bf;--line:#d8e5ee;--muted:#71828d}
body[data-theme="lavender"]{--paper:#fefcff;--soft:#eee8f7;--accent:#9a86b6;--line:#e2dbea;--muted:#7f748c}
body[data-theme="mono"]{--paper:#fff;--soft:#f0f0f0;--accent:#666;--line:#ddd;--muted:#777}

body[data-font-size="small"]{font-size:13px}
body[data-font-size="normal"]{font-size:15px}
body[data-font-size="large"]{font-size:17px}
body[data-font-size="small"] .ev,body[data-font-size="small"] .task .txt{font-size:11px!important}
body[data-font-size="normal"] .ev,body[data-font-size="normal"] .task .txt{font-size:13px!important}
body[data-font-size="large"] .ev,body[data-font-size="large"] .task .txt{font-size:15px!important}

body[data-font-family="gothic"]{font-family:Arial,"Noto Sans KR",sans-serif}
body[data-font-family="round"]{font-family:"Arial Rounded MT Bold","Malgun Gothic","Noto Sans KR",sans-serif}
body[data-font-family="serif"]{font-family:"Batang","Nanum Myeongjo",serif}

@media(max-width:900px){
  .notepad-layout{grid-template-columns:230px 1fr!important}
}
</style>


<style>
/* v12 - 탭형 Work Diary */
html,body{min-width:0!important;overflow-x:auto!important}
.tab-app{width:100%!important;min-width:1180px!important;max-width:none!important;height:100vh!important;padding:18px!important;overflow:visible!important}
.tab-top{
  min-width:1144px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;
  padding:0 2px 12px;border-bottom:1px solid var(--line)
}
.main-tabs{display:flex;justify-content:center;gap:6px}
.tab-btn{
  border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;
  font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--muted)
}
.tab-btn:hover{background:var(--soft)}
.tab-btn.active{background:var(--soft);color:var(--accent)}
.settings-tab{margin-left:5px}
.top-right{display:flex;align-items:center;gap:12px;white-space:nowrap}
.view-stage{min-width:1144px;height:calc(100vh - 76px);padding-top:12px}
.view-panel{display:none;height:100%}
.view-panel.active{display:block}
.monthly-full,.weekly-full,.notepad-page{
  height:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden
}
.monthly-full{display:flex;flex-direction:column}
.monthly-full .section-head{flex:0 0 auto}
.monthly-full .weekdays{flex:0 0 auto}
.monthly-full .days{flex:1;min-height:0}
#monthlyView #cal .ev{
  white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
  overflow-wrap:break-word!important;word-break:keep-all!important;height:auto!important
}

.weekly-full{display:flex;flex-direction:column}
.weekly-full .week-head{flex:0 0 auto}

<script>

const $=s=>document.querySelector(s);
const API_URL='https://script.google.com/macros/s/AKfycbx-n8fe-svV3d7TVZAkEp6XNHImb09E60zBnNxekaGuG27HVWnKwM5O6IlfxGGaPdwv/exec';

let events={}, tasks={}, notes={}, scratches=[];
let serverRows=[];
let syncTimer=null;

function setSync(text,state=''){
  const el=$('#syncStatus');
  if(!el)return;
  el.textContent=text;
  el.className='sync-status '+state;
}

async function apiGet(){
  setSync('Google Sheets 불러오는 중…','saving');
  const res=await fetch(API_URL,{method:'GET',redirect:'follow'});
  if(!res.ok) throw new Error('GET '+res.status);
  return await res.json();
}

async function apiPost(payload){
  setSync('저장 중…','saving');
  const res=await fetch(API_URL,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('POST '+res.status);
  const data=await res.json();
  if(data && data.success===false) throw new Error(data.message||'저장 실패');
  setSync('저장됨','ok');
  return data;
}

function rebuildState(rows){
  serverRows=Array.isArray(rows)?rows:[];
  events={}; tasks={}; notes={};

  serverRows.forEach(r=>{
    if(r.type==='event'){
      (events[r.date]??=[]).push({id:r.id,text:String(r.content??''),color:String(r.color??r.colour??'')});
    }else if(r.type==='task'){
      (tasks[r.date]??=[]).push({
        id:r.id,
        text:String(r.content??''),
        done:r.done===true || String(r.done).toLowerCase()==='true',
        col:Number(r.position)||0,
        color:String(r.color??r.colour??'')
      });
    }else if(r.type==='note'){
      notes[`${r.date}:${r.position}`]={id:r.id,text:String(r.content??'')};
    }else if(r.type==='scratch'){
      scratches.push({
        id:r.id,
        title:String(r.position??'').trim() || '제목 없는 메모',
        body:String(r.content??''),
        date:String(r.date??''),
        updatedAt:r.updatedAt||''
      });
    }
  });
}

function leapMonth(y){return lunarInfo[y-1900]&0xf}
function leapDays(y){if(leapMonth(y))return (lunarInfo[y-1900]&0x10000)?30:29;return 0}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29}
function yearDays(y){let sum=348;for(let i=0x8000;i>0x8;i>>=1)sum+=(lunarInfo[y-1900]&i)?1:0;return sum+leapDays(y)}
function lunarToSolar(y,m,d){
 let offset=0;
 for(let yy=1900;yy<y;yy++)offset+=yearDays(yy);
 let leap=leapMonth(y);
 for(let mm=1;mm<m;mm++){offset+=monthDays(y,mm);if(mm===leap)offset+=leapDays(y)}
 offset+=d-1;
 const base=new Date(1900,0,31,12);
 base.setDate(base.getDate()+offset);
 return base;
}
function observedAfter(d,name){
 let x=new Date(d);
 do{x.setDate(x.getDate()+1)}while(x.getDay()===0 || holidays[key(x)]);
 addHoliday(x,name);
}
function buildHolidays(y){
 holidays={};
 // 고정 공휴일
 addHoliday(solarDate(y,1,1),'신정');
 addHoliday(solarDate(y,3,1),'삼일절');
 addHoliday(solarDate(y,5,5),'어린이날');
 addHoliday(solarDate(y,6,6),'현충일');
 addHoliday(solarDate(y,8,15),'광복절');
 addHoliday(solarDate(y,10,3),'개천절');
 addHoliday(solarDate(y,10,9),'한글날');
 addHoliday(solarDate(y,12,25),'성탄절');

 // 음력 공휴일
 if(y>=1900 && y<=2099){
   let seol=lunarToSolar(y,1,1);
   let seolPrev=new Date(seol);seolPrev.setDate(seolPrev.getDate()-1);
   let seolNext=new Date(seol);seolNext.setDate(seolNext.getDate()+1);
   addHoliday(seolPrev,'설날 연휴'); addHoliday(seol,'설날'); addHoliday(seolNext,'설날 연휴');
   let bud=lunarToSolar(y,4,8);addHoliday(bud,'부처님오신날');
   let chu=lunarToSolar(y,8,15), cp=new Date(chu), cn=new Date(chu);
   cp.setDate(cp.getDate()-1);cn.setDate(cn.getDate()+1);
   addHoliday(cp,'추석 연휴');addHoliday(chu,'추석');addHoliday(cn,'추석 연휴');

   // 대체공휴일: 설/추석, 어린이날, 삼일절, 광복절, 개천절, 한글날, 부처님오신날, 성탄절
   const groups=[
     {dates:[seolPrev,seol,seolNext],name:'설날 대체공휴일',weekend:true},
     {dates:[cp,chu,cn],name:'추석 대체공휴일',weekend:true}
   ];
   groups.forEach(g=>{
     if(g.dates.some(x=>x.getDay()===0)) observedAfter(g.dates[g.dates.length-1],g.name);
   });
   [[solarDate(y,3,1),'삼일절 대체공휴일'],[solarDate(y,5,5),'어린이날 대체공휴일'],
    [bud,'부처님오신날 대체공휴일'],[solarDate(y,8,15),'광복절 대체공휴일'],
    [solarDate(y,10,3),'개천절 대체공휴일'],[solarDate(y,10,9),'한글날 대체공휴일'],
    [solarDate(y,12,25),'성탄절 대체공휴일']].forEach(([d,n])=>{
      if(d.getDay()===0 || d.getDay()===6) observedAfter(d,n);
   });
 }
 Object.entries(specialHolidays).forEach(([k,n])=>{if(k.startsWith(String(y)))holidays[k]=n});
}


let now=new Date(), month=new Date(now.getFullYear(),now.getMonth(),1), selected=new Date(now), weekStart=monday(now), modalKey='';

async function addTask(k,input,col){
  const v=input.value.trim();
  if(!v)return;

  const taskDate=new Date(k+'T00:00:00');
  const taskDay=taskDate.getDay();
  const maxTasks=(taskDay===0||taskDay===6)?2:7;
  const currentTotal=(tasks[k]||[]).length;

  if(currentTotal>=maxTasks){
    alert(taskDay===0||taskDay===6
      ? '토·일은 할 일을 최대 2개까지 등록할 수 있어요.'
      : '평일은 할 일을 최대 7개까지 등록할 수 있어요.');
    return;
  }

  const color=input.dataset.color||'';
  try{
    setSync('저장 중…');
    const r=await apiPost({
      action:'add',
      type:'task',
      date:k,
      position:String(col),
      content:v,
      done:false,
      color
    });
    (tasks[k]??=[]).push({
      id:r.id,
      text:v,
      done:false,
      position:String(col),
      color
    });
    input.value='';
    input.dataset.color='';
    renderWeek();
    setSync('저장됨');
  }catch(e){
    console.error(e);
    setSync('저장 실패');
    alert('할 일을 저장하지 못했습니다.');
  }
}

async function updateTask(id,done){
 const found=Object.values(tasks).flat().find(t=>t.id===id); if(!found)return;
 found.done=done; renderWeek();
 try{await apiPost({action:'update',id,done})}
 catch(e){found.done=!done;renderWeek();setSync('저장 실패','error');alert('완료 상태를 저장하지 못했습니다.')}
}

async function deleteTask(id){
 let holder=null, idx=-1;
 for(const [k,list] of Object.entries(tasks)){
   const i=list.findIndex(t=>t.id===id);
   if(i>=0){holder=k;idx=i;break}
 }
 if(holder===null)return;
 const removed=tasks[holder].splice(idx,1)[0]; renderWeek();
 try{await apiPost({action:'delete',id})}
 catch(e){tasks[holder].splice(idx,0,removed);renderWeek();setSync('삭제 실패','error');alert('할 일을 삭제하지 못했습니다.')}
}

async function saveNote(date,position,content){
 const nk=`${date}:${position}`, existing=notes[nk];
 try{
   if(existing){
     await apiPost({action:'update',id:existing.id,content});
     existing.text=content;
   }else if(content.trim()){
     const r=await apiPost({action:'add',type:'note',date,position,content,done:false});
     notes[nk]={id:r.id,text:content};
   }
 }catch(e){console.error(e);setSync('저장 실패','error')}
}

/* ---------- 메모장 ---------- */
let activeScratchId='';

function scratchDateText(s){
  if(s.updatedAt){
    const d=new Date(s.updatedAt);
    if(!isNaN(d)) return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  return s.date||'';
}
function renderScratchList(){
  const list=[...scratches].sort((a,b)=>String(b.updatedAt||b.date).localeCompare(String(a.updatedAt||a.date)));
  $('#scratchList').innerHTML=list.length?list.map(s=>`
    <button type="button" class="scratch-item ${String(s.id)===String(activeScratchId)?'active':''}" data-scratch-id="${s.id}">
      <strong>${esc(s.title||'제목 없는 메모')}</strong>
      <span>${esc(scratchDateText(s))}</span>
    </button>`).join(''):'<div style="padding:14px;font-size:12px;color:var(--muted)">저장된 메모가 없습니다.</div>';
  document.querySelectorAll('[data-scratch-id]').forEach(b=>b.onclick=()=>openScratch(b.dataset.scratchId));
}
function newScratch(){
  activeScratchId='';
  $('#scratchTitle').value='';
  $('#scratchBody').value='';
  $('#scratchMeta').textContent='새 메모';
  $('#deleteScratch').disabled=true;
  renderScratchList();
  $('#scratchTitle').focus();
}
function openScratch(id){
  const s=scratches.find(x=>String(x.id)===String(id)); if(!s)return;
  activeScratchId=s.id;
  $('#scratchTitle').value=s.title==='제목 없는 메모'?'':s.title;
  $('#scratchBody').value=s.body||'';
  $('#scratchMeta').textContent='마지막 저장: '+scratchDateText(s);
  $('#deleteScratch').disabled=false;
  renderScratchList();
}
$('#newScratch').onclick=newScratch;

$('#saveScratch').onclick=async()=>{
  const title=$('#scratchTitle').value.trim()||'제목 없는 메모';
  const body=$('#scratchBody').value;
  if(!body.trim() && title==='제목 없는 메모'){alert('메모 내용을 입력해주세요.');return}
  const now=new Date();
  const date=key(now);
  try{
    if(activeScratchId){
      await apiPost({action:'update',id:activeScratchId,position:title,content:body});
      const s=scratches.find(x=>String(x.id)===String(activeScratchId));
      if(s){s.title=title;s.body=body;s.updatedAt=new Date().toISOString()}
    }else{
      const r=await apiPost({action:'add',type:'scratch',date,position:title,content:body});
      const s={id:r.id,title,body,date,updatedAt:new Date().toISOString()};
      scratches.push(s); activeScratchId=r.id;
    }
    $('#scratchMeta').textContent='저장됨: '+new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    $('#deleteScratch').disabled=false;
    renderScratchList();
  }catch(e){console.error(e);alert('메모를 저장하지 못했습니다.')}
};

$('#deleteScratch').onclick=async()=>{
  if(!activeScratchId||!confirm('이 메모를 삭제할까요?'))return;
  try{
    await apiPost({action:'delete',id:activeScratchId});
    scratches=scratches.filter(x=>String(x.id)!==String(activeScratchId));
    newScratch();
  }catch(e){console.error(e);alert('메모를 삭제하지 못했습니다.')}
};

 try{
   setSync('저장 중…','saving');
   await apiPost({action:'update',id:editState.id,content:v,color:editState.color});
   const bucket=editState.type==='event'?events:tasks;
   const item=(bucket[editState.key]||[]).find(x=>String(x.id)===String(editState.id));

 }
};

$('#editDelete').onclick=async()=>{
 if(!confirm('이 내용을 삭제할까요?'))return;
 try{
   setSync('삭제 중…','saving');
   await apiPost({action:'delete',id:editState.id});

   $('#editModal').classList.remove('on');

   setSync('삭제 오류','error');

 }
};
